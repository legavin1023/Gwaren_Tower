# Local-only development. Production deploys use wrangler.toml / index.mjs.
name = "dragonage-circle-local"
main = "dev.mjs"
compatibility_date = "2026-11-16"

[vars]
LOCAL_DEVELOPMENT = "1"
SITE_ORIGIN = "http://localhost:8090"
BOOTSTRAP_ADMIN_EMAIL = "developer@circle.local"

[[d1_databases]]
binding = "DB"
database_name = "circle-alliance-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "circle-alliance-local"


[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1-realtime"
new_sqlite_classes = ["RealtimeHub"]

# Approximate per-location limits; local namespaces are separate from production.

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "867542001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "867542002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "867542003"
simple = { limit = 20, period = 60 }

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v2-shared-chat"
new_sqlite_classes = ["ChatRoom"]

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "867542004"
simple = { limit = 30, period = 60 }
